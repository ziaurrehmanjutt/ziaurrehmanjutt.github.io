<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <meta name="robots" content="noindex">
  <meta name="description" content="The page you were looking for could not be found.">
  <title>Page not found — Zia-ur-Rehman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --background: #101211;
      --surface: #171a18;
      --text: #f3f3ed;
      --muted: #a2a8a0;
      --accent: #c6f36a;
      --line: rgba(243, 243, 237, .12);
    }

    * { box-sizing: border-box; }
    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(198, 243, 106, .08), transparent 38%),
        var(--background);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .header {
      display: flex;
      min-height: 76px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .header-inner, .footer-inner {
      display: flex;
      width: min(1080px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      margin-inline: auto;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 800; letter-spacing: -.04em; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: var(--background);
      font-family: "DM Mono", monospace;
      font-size: 13px;
    }
    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 64px 24px 76px;
      text-align: center;
    }
    .message { max-width: 610px; }
    .code {
      margin: 0 0 13px;
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 13px;
      letter-spacing: .18em;
    }
    h1 { margin: 0 0 17px; font-size: clamp(2.5rem, 8vw, 4.8rem); font-weight: 600; letter-spacing: -.08em; line-height: 1.05; }
    .description { max-width: 420px; margin: 0 auto 28px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent);
      color: #11140e;
      font-size: 12px;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease;
    }
    .button:hover { transform: translateY(-2px); background: #d6ff83; }
    .button.secondary { border-color: var(--line); background: var(--surface); color: var(--text); }
    .button.secondary:hover { border-color: var(--accent); background: var(--surface); }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .footer-inner { min-height: 64px; gap: 1rem; }
    @media (max-width: 520px) {
      .header-inner, .footer-inner { width: calc(100% - 32px); }
      .footer-inner { align-items: flex-start; flex-direction: column; justify-content: center; padding-block: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Zia-ur-Rehman, home">
        <span class="brand-mark" aria-hidden="true">ZR</span>
        <span>Zia-ur-Rehman</span>
      </a>
      <a href="/" aria-label="Return to homepage">Back to home <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main>
    <div class="message">
      <p class="code">ERROR 404</p>
      <h1>Page not found.</h1>
      <p class="description">Looks like this link took a wrong turn. The page may have moved or no longer exists.</p>
      <div class="actions">
        <a class="button" href="/">Back to homepage <span aria-hidden="true">→</span></a>
        <a class="button secondary" href="/#projects">Explore projects</a>
      </div>
    </div>
  </main>
  <footer>
    <div class="footer-inner">
      <span>© 2026 Zia-ur-Rehman</span>
      <span>Every good link starts somewhere.</span>
    </div>
  </footer>
</body>
</html>
